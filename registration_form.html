<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karan Singh</title>
    <h1 align="center"><b>Student Registeration Form</b></h1><hr>
</head>
<body>
    <form action="" method="" name="registrationForm">
        <label for="firstName">First Name:</label>
        <input type="text" id="firstname"
        maxlength="50" minlength="5" required>
        <!-- last name -->
         <label for="lasttName">Last Name:</label>
        <input type="text" id="lastName"
        maxlength="50" minlength="5" required>
                <br><br>
                <!-- email -->
                 <label for="email">Email:</label>
        <input type="email" id="email"
        maxlength="50" minlength="5" required><br><br>
        <!-- password -->
         <label for="pass">Password:</label>
        <input type="password" id="pass"
        maxlength="15" minlength="8" required><br><br>
        <!-- gender -->
         <label for="gender">Gender:</label>
         <label for="male">Male</label>
         <input type="radio" id="male" name="gender">

         <label for="female">Female</label>
         <input type="radio" id="female" name="gender">

         <label for="other">Other</label>
         <input type="radio" id="other" name="gender"><br><br>
         <!-- course -->
          <label for="course">Course:</label>
           <select name="stream" id="stream">
     <option>PCM</option>
     <option>PCB</option>
     <option>Commerce</option>
     <option>PCMB</option>
     </select>
          </option><br><br>
          <!-- address -->
            <label for="address">Address:</label><br>
        <textarea type="text" id="address" row="4" col="20" placeholder="Enter Address"></textarea>
        <br><br>
        <button type="submit">Register</button>
        <button type="reset">Clear</button><br><br><hr>
        <!-- copyright -->
         <p align="center">&copy; 2025 Student Register Portal</p>



    </form>
</body>
</html>
